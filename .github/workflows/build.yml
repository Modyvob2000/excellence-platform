name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1) تحميل المشروع
      - name: Checkout project
        uses: actions/checkout@v7

      # 2) Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3) Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4) تثبيت تراخيص Android
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      # 5) تثبيت Android SDK 34 و35
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "build-tools;35.0.0"

      # 6) إعداد Gradle 8.7
      # المشروع لا يحتوي على Gradle Wrapper
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      # 7) التأكد من ملفات Android
      - name: Check Android project
        working-directory: android
        run: |
          echo "===== Android Project ====="
          ls -la

          echo "===== Gradle Files ====="
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      # 8) بناء APK Debug
      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 9) البحث عن APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      # 10) رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
