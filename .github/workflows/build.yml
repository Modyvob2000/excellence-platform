name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل الـ Build يدوياً من تبويب Actions في قيت هب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java JDK 17 أو 21 حسب متطلبات مشروعك)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد أندرويد SDK والموافقة التلقائية على التراخيص (حل المشكلة)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 4. منح صلاحيات التنفيذ لـ Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. بناء نسخة الإصدار (Release APK) أو Debug حسب رغبتك
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. رفع ملف الـ APK الناتج كـ Artifact لتحميله بعد انتهاء الـ Build
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
