version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      - db

  # صورة رسمية جاهزة تجمع PostgreSQL 16 + pgvector مُبنية مسبقًا —
  # لا حاجة لبناء pgvector من المصدر يدويًا، ولا لأي خطوة تثبيت إضافية.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: excellence_platform
      POSTGRES_USER: excellence
      POSTGRES_PASSWORD: excellence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
